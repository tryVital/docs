# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # triggered on a custom event
  repository_dispatch:
    types: [trigger_ci]
 
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: junction-bee
    permissions: {}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_SECRET }}
          permission-contents: write

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Runs a single command using the runners shell
      - name: Download swagger and push it
        run: |
          echo "$GITHUB_WORKSPACE"
          wget https://api.us.junction.com/openapi.json -O ./docs/swagger.json
          wget https://api.management.junction.com/openapi.json -O ./docs/org-management-api.json
          git config user.name 'junction-bee[bot]'
          git config user.email '281078306+junction-bee[bot]@users.noreply.github.com'
          git add .
          git commit -m "[automated commit] update swagger.json"
          git push

